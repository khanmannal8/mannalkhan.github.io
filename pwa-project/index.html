<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PrepSync</title>

  <link rel="manifest" href="manifest.json">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-dark bg-dark px-3">

    <h1 class="text-light">PrepSync</h1>

  </nav>

  <!-- MAIN CONTENT -->

  <div class="container mt-4">

    <!-- HEADER -->

    <div class="text-center mb-4">

      <h2>Smart Study Dashboard</h2>

      <p>Study smarter. Anywhere. Anytime.</p>

    </div>

    <!-- SEARCH BAR -->

    <div class="mb-4">

      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Search topics..."
      >

    </div>

    <!-- PROGRESS TRACKER -->

    <div class="text-center mb-4">

      <h4 id="progressText">

        Completed Topics: 0

      </h4>

    </div>

    <!-- STUDY TIMER -->

    <div class="text-center mb-5">

      <button
        class="btn btn-primary"
        onclick="startTimer()"
      >

        Start 25-Min Study Session

      </button>

      <h3 id="timer" class="mt-3"></h3>

    </div>

    <!-- DYNAMIC TOPIC CARDS -->

    <div class="row"
         id="topicsContainer">

    </div>

  </div>

  <!-- FOOTER -->

  <footer class="text-center mt-5 mb-3">

    <p>

      PrepSync © 2026 | Built by Mannal Khan

    </p>

  </footer>

  <script src="app.js"></script>

</body>

</html>
