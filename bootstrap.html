<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Page</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h1 class="text-center">Bootstrap Grid Example</h1>
    <p class="text-center">CISC 3610 - Mannal Khan</p>

    <!-- ROW 1 -->
    <div class="row mt-4">
        <div class="col-4 bg-primary text-white p-3">
            Column 1
        </div>
        <div class="col-4 bg-success text-white p-3">
            Column 2
        </div>
        <div class="col-4 bg-danger text-white p-3">
            Column 3
        </div>
    </div>

    <!-- ROW 2 -->
    <div class="row mt-4">
        <div class="col-6 bg-warning p-3">
            Half
        </div>
        <div class="col-6 bg-info p-3">
            Half
        </div>
    </div>

    <!-- ROW 3 -->
    <div class="row mt-4">
        <div class="col-3 bg-dark text-white p-3">3</div>
        <div class="col-3 bg-secondary text-white p-3">3</div>
        <div class="col-3 bg-primary text-white p-3">3</div>
        <div class="col-3 bg-success text-white p-3">3</div>
    </div>

    <!-- BACK LINK -->
    <div class="mt-4">
        <a href="index.html">Back to Portfolio</a>
    </div>

</div>

</html>
